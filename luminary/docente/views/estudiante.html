<button class="volver" id="volver">
  <img src="/assets/icon/arrow.svg" alt="" />
  Volver
</button>
<div class="header-dashboard">
  <div class="contenedor">
    <span>Ficha de Estudiante</span>
    <div class="ficha-botones">
      <div class="dropdown">
        <button
          class="btn-transparente-2 dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img src="/assets/icon/pdf-blue.svg" />
          Descargar informe
        </button>
        <ul class="dropdown-menu">
          <li>
            <button
              class="dropdown-item informe-notas-semestral"
              data-semestre="1"
            >
              1° Semestre
            </button>
          </li>
          <li>
            <button
              class="dropdown-item informe-notas-semestral"
              data-semestre="2"
            >
              2° Semestre
            </button>
          </li>
          <li>
            <button class="dropdown-item" id="informe-notas">Anual</button>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <h2 data-estudiante="nombre-completo" style="margin: 0"></h2>
</div>
<div class="info-estudiante">
  <div class="card-dato">
    <span>Curso:</span>
    <span class="curso-1" data-estudiante="curso"></span>
  </div>
  <div class="card-dato">
    <span>Edad:</span>
    <p><span data-estudiante="edad"></span></p>
  </div>
  <div class="card-dato">
    <span>Promedio General:</span>
    <span class="card-dato-text" id="promedio-general"></span>
  </div>
</div>
<div>
  <div class="contenedor-notas">
    <h3>Notas del estudiante</h3>
    <table id="tabla-notas"></table>
  </div>
</div>
