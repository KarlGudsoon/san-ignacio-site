<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="/luminary/public/global.css" />
    <link

      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Document</title>
  </head>
  <body>
    <aside class="nav-top" id="navbar"></aside>
    <div id="mensaje"></div>
    <main id="dashboard-content"></main>
    <div id="navbarmobile"></div>

    <script type="module" src="/luminary/docente/js/layout.js"></script>
    <script src="/luminary/docente/js/dashboard.js"></script>
    <script type="module" src="/luminary/docente/js/router.js"></script>
    <script src="/luminary/docente/js/cursos.js"></script>
    <script src="/luminary/docente/js/evaluaciones.js"></script>
    <script src="/luminary/docente/js/asignatura.js"></script>
    <script src="/luminary/docente/js/material.js"></script>
    <script src="/luminary/docente/js/unidades.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script>
      let asignaturas = document.querySelectorAll(".curso");
      asignaturas.forEach((element) => {
        const texto = element.textContent.trim();

        if (texto.includes("1°")) {
          element.style.backgroundColor = "#0da761"; // Verde
        } else if (texto.includes("2° Nivel")) {
          element.style.backgroundColor = "#3891e9"; // Azul
        }
      });
    </script>
  </body>
