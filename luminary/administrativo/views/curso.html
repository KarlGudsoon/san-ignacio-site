<div class="asignatura-header">
  <div
    class="asignatura-detalle"
    id="curso-detalle"
    style="view-transition-name: asignatura"
  >
    <div class="flex-column">
      <div class="flex justify-between">
        <button
          class="volver"
          id="volver"
          style="
            background-color: transparent;
            color: white;
            border: 1px solid white;
            box-shadow: none;
          "
        >
          <img
            src="/assets/icon/arrow.svg"
            alt=""
            style="
              filter: brightness(0) saturate(100%) invert(100%) sepia(57%)
                saturate(779%) hue-rotate(201deg) brightness(113%)
                contrast(101%);
            "
          />
          Volver
        </button>
        <div class="dropdown">
          <button
            class="btn-transparente dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img src="/assets/icon/pdf-white.svg" />
            Descargar informe
          </button>
          <ul class="dropdown-menu">
            <li>
              <button
                class="dropdown-item informe-notas-semestral"
                data-semestre="1"
              >
                1° Semestre
              </button>
            </li>
            <li>
              <button
                class="dropdown-item informe-notas-semestral"
                data-semestre="2"
              >
                2° Semestre
              </button>
            </li>
            <li>
              <button
                class="dropdown-item informe-notas-semestral"
                id="btnInformeNotas"
              >
                Anual
              </button>
            </li>
          </ul>
        </div>
      </div>
      <h2
        id="nombre-curso"
        style="view-transition-name: asignatura-titulo"
      ></h2>
      <span id="curso-niveles"></span>
    </div>

    <div class="asignatura-icon">
      <img id="asignatura-icon" src="" alt="" />
    </div>
    <div class="contenedor-promedio"></div>
  </div>
  <div class="asignatura-navegacion">
    <!-- <button id="btn-inicio" class="seleccionado">Inicio</button> -->
    <button id="btn-estudiantes" class="seleccionado">Estudiantes</button>
    <button id="btn-evaluaciones">Evaluaciones</button>
    <button id="btn-notas">Notas</button>
    <button id="btn-distancia">Material a distancia</button>
    <button id="btn-configuracion">Configuración</button>
  </div>
</div>

<div class="contenedor-principal" id="curso-contenido"></div>

<div class="contenedor-form" id="form-evaluacion">
  <button type="button" class="cerrar-modal" data-cerrar="form-evaluacion">
    <img src="/assets/icons/close.svg" alt="" />
  </button>
  <form id="formEvaluacion">
    <h2>Crear evaluación</h2>
    <div>
      <label>Título</label>
      <input type="text" id="titulo" placeholder="Título" required />
    </div>

    <div>
      <label>Descripción</label>
      <textarea id="descripcion"></textarea>
    </div>

    <input id="cursoProfesorSelect" disabled required />

    <div>
      <label>Tipo de Evaluación</label>
      <select id="tipoSelect" required>
        <option value="">Cargando...</option>
      </select>
    </div>

    <div>
      <label>Fecha de Aplicación</label>
      <input type="date" id="fecha" />
    </div>

    <div>
      <label>Semestre</label>
      <select id="semestreSelect" required>
        <option value="1">Primer Semestre</option>
        <option value="2">Segundo Semestre</option>
      </select>
    </div>

    <div style="flex-direction: row; gap: 1rem; align-items: center">
      <label>Coeficiente 2</label>
      <input id="coeficiente2" type="checkbox" />
    </div>

    <button type="submit">Crear Evaluación</button>
  </form>
</div>
