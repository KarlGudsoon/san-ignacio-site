<div class="header-dashboard">
  <h2>Notas por asignatura</h2>
  <p>Aquí puedes ver tus notas de tus asignaturas.</p>
  <div class="contenedor-space-between">
    <p class="nota-aclaratoria-red">
      Nota: Las calificaciones y promedios se actualizan de manera continua según
      el avance del semestre. Los valores reflejados al día de hoy NO son finales.
    </p>
    <div class="dropdown">
        <button
          class="btn-transparente-2 dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img src="/assets/icon/pdf-blue.svg" />
          Descargar informe
        </button>
        <ul class="dropdown-menu">
          <li>
            <button
              class="dropdown-item informe-notas-semestral"
              data-semestre="1"
            >
              1° Semestre
            </button>
          </li>
          <li>
            <button
              class="dropdown-item informe-notas-semestral"
              data-semestre="2"
            >
              2° Semestre
            </button>
          </li>
          <li>
            <button class="dropdown-item informe-notas-semestral">Anual</button>
          </li>
        </ul>
      </div>
  </div>
</div>
<div class="contenedor-principal">
  <div class="info-estudiante" style="margin-bottom: 1rem">
    <div class="card-dato">
      <span class="card-dato-titulo">Promedio 1° Sem:</span>
      <span class="card-dato-text card-promedio" id="promedio-1"></span>
    </div>
    <div class="card-dato">
      <span class="card-dato-titulo">Promedio 2° Sem:</span>
      <span class="card-dato-text card-promedio" id="promedio-2"></span>
    </div>
  </div>
  <div class="contenedor-notas">
    <h3>Notas del estudiante</h3>
    <table id="tabla-notas"></table>
  </div>
</div>
